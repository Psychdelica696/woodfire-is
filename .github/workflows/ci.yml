name: WoodFire CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Check repository structure
        run: npm run check

      - name: Check JavaScript syntax
        run: npm run lint

      - name: Run unit tests
        run: npm test

      - name: Package project
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: |
          mkdir -p dist
          zip -r dist/woodfire-is.zip src tests scripts docs package.json README.md

      - name: Upload artifact
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: woodfire-is-package
          path: dist/woodfire-is.zip
          retention-days: 30
